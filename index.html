<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Beat the Slide</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A daily habit your kid actually wants to keep. Coming soon.">
<meta name="theme-color" content="#0F1A2E">

<!-- Social preview: deliberately says nothing about features or timing. -->
<meta property="og:title" content="Beat the Slide">
<meta property="og:description" content="A daily habit your kid actually wants to keep. Coming soon.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://beattheslide.com/">
<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">

<style>
  /* Palette is the kid surface from the design system — the one place the
     brand shows up before launch. Values match src/styles/tokens.css. */
  :root{
    --bg:#0F1A2E; --panel:#1E3050; --border:#3A5380;
    --ink:#FFFFFF; --soft:#D6E2F5; --muted:#B8C7DF;
    --purple:#C4B5FD; --gold:#FFD84A; --green:#5EEA93;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px; -webkit-font-smoothing:antialiased; line-height:1.6;
  }
  .card{ width:100%; max-width:420px; text-align:center; }

  .mark{
    width:64px; height:64px; margin:0 auto 22px;
    display:grid; place-items:center; border-radius:18px;
    background:linear-gradient(135deg,#C4B5FD,#8B7BE8);
    color:#0F1A2E; font-size:30px; line-height:1;
  }
  h1{
    font-size:clamp(30px,7vw,40px); font-weight:800; letter-spacing:-.02em;
    margin:0 0 12px; text-wrap:balance;
  }
  .tag{ color:var(--soft); font-size:17px; margin:0 0 6px; text-wrap:balance; }
  .soon{
    display:inline-flex; align-items:center; gap:7px; margin:18px 0 26px;
    font-size:13px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
    color:var(--gold); background:rgba(255,216,74,.12);
    border:1px solid rgba(255,216,74,.34); padding:7px 14px; border-radius:999px;
  }

  form{ display:flex; flex-direction:column; gap:10px; }
  label{ text-align:left; font-size:13px; font-weight:700; color:var(--muted); }
  input{
    width:100%; font:inherit; font-size:16px; padding:14px;
    min-height:48px; color:var(--ink); background:var(--panel);
    border:2px solid var(--border); border-radius:12px;
  }
  input::placeholder{ color:#7D8FA8 }
  input:focus{ border-color:var(--purple); outline:none }
  button{
    font:inherit; font-size:16px; font-weight:800; min-height:48px;
    padding:14px; border:none; border-radius:12px; cursor:pointer;
    background:var(--purple); color:#0F1A2E;
  }
  button:hover{ filter:brightness(1.06) }
  .note{ font-size:13px; color:var(--muted); margin:14px 0 0 }
  .ok{
    display:none; align-items:center; justify-content:center; gap:8px;
    color:var(--green); background:rgba(94,234,147,.10);
    border:1px solid rgba(94,234,147,.35); border-radius:12px;
    padding:14px; font-weight:700; font-size:15px;
  }
  .ok.show{ display:flex }
  form.hide{ display:none }
  footer{ margin-top:30px; font-size:12.5px; color:var(--muted) }
  :focus-visible{ outline:2px solid var(--purple); outline-offset:2px }
  @media(prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">📚</div>
    <h1>Beat the Slide</h1>
    <p class="tag">A daily habit your kid actually wants to keep.</p>
    <div class="soon">Coming soon</div>

    <form id="f" novalidate>
      <label for="email">Get an email when it opens</label>
      <input id="email" name="email" type="email" inputmode="email"
             autocomplete="email" placeholder="you@example.com" required>
      <button type="submit">Notify me</button>
    </form>

    <div class="ok" id="ok" role="status">
      <span aria-hidden="true">✓</span><span>Thanks — we’ll be in touch.</span>
    </div>

    <p class="note">No spam. One email, when it’s ready.</p>
    <footer>© 2026 Beat the Slide</footer>
  </main>

<script>
  // Stores interest locally so a visitor gets real feedback and nothing is lost
  // before a real backend exists. Swap for a form endpoint when one is chosen.
  var f = document.getElementById('f'), ok = document.getElementById('ok');
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('email').value.trim();
    if (!v || v.indexOf('@') < 1) { document.getElementById('email').focus(); return; }
    try {
      var list = JSON.parse(localStorage.getItem('bts-waitlist') || '[]');
      if (list.indexOf(v) === -1) list.push(v);
      localStorage.setItem('bts-waitlist', JSON.stringify(list));
    } catch (err) { /* private mode — still show success */ }
    f.className = 'hide';
    ok.className = 'ok show';
  });
</script>
</body>
</html>
